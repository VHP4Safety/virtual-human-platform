# Corrections made once by python -m linkeddata launch, after the first import (python -m linkeddata import).
# Each is saved as a revision named with its reason (why). Fields are named as in JSON-LD; values as stored.
corrections:
  - record: casestudies/kidney
    why: Datasets are moved from tools to data.
    move:
      - {field: tool, to: supply, values: ["Clinical data", "Cell viability data"]}
  - record: casestudies/parkinson
    why: Datasets are moved from tools to data.
    move:
      - field: tool
        to: supply
        values: ["Rotenone transcriptomic data (LUHMES cells)", "Epidemiological data", "Dietary exposure dataset for pesticides",
                 "Environmental exposure dataset for pesticides", "Occupational exposure dataset for pesticides"]
  - record: casestudies/thyroid
    why: HTML characters are escaped, and a stray document end is removed.
    replace:
      - {field: text, from: "D2&3", to: "D2&amp;3"}
      - {field: text, from: "(**p<0.01)", to: "(**p&lt;0.01)"}
      - {field: text, from: "A BER < 1", to: "A BER &lt; 1"}
      - {field: text, from: "***p<0.001, ****p<0.0001", to: "***p&lt;0.001, ****p&lt;0.0001"}
      - {field: text, from: "</table></body></html>", to: "</table>"}
