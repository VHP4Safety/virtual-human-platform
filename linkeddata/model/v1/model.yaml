# The record classes, by kind; records of every kind can be written on the platform. A node of these classes
# is a record with its own address; a node of another class of the profile, such as a page section, is part
# of the record that holds it.
kinds:
  tools: https://schema.org/SoftwareApplication
  methods: https://bioschemas.org/draft_terms/LabProtocol
  casestudies: https://schema.org/ResearchProject
  publications: https://schema.org/ScholarlyArticle
  data: https://schema.org/Dataset
  organizations: https://schema.org/Organization
  people: https://schema.org/Person
  pages: https://schema.org/WebPage
  terms: https://schema.org/DefinedTerm
  vocabularies: https://schema.org/DefinedTermSet

# Used for short names in the YAML mappings and in the JSON-LD documents.
prefixes:
  schema: https://schema.org/
  bioschemas_draft: https://bioschemas.org/draft_terms/
  dct: http://purl.org/dc/terms/

