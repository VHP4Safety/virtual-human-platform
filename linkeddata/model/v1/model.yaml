# Version 1 of the platform's data model.

# Every record that has a page on the platform is identified by its page address.
base: https://platform.vhp4safety.nl/

# Vocabularies are pinned to exact versions, and kept in vocabularies/ with the SHA-256 of their content.
vocabularies:
  schemaorg-30.1.ttl:
    url: https://schema.org/version/30.1/schemaorg-current-https.ttl
    sha256: 7f15ca89398c4f235f478a4b3b8d1f975d63c5a860b77c8a8fce01f791b7ae2f
  bioschemas-draft-types-e5c27db.jsonld:
    url: https://raw.githubusercontent.com/BioSchemas/bioschemas.github.io/e5c27dbd2b1269a79fbe8f26e0173a9dc390aff0/pages/_types/bioschemas_draft_types.jsonld
    sha256: 420b235d76aaafa92e72a6ed730457222166b455c7ff0df5f4365dd2dd887de8
  vhp4safety-glossary-34f9389.ttl:
    url: https://raw.githubusercontent.com/VHP4Safety/glossary/34f9389a7f1f0073b67161e1ca6e6a6cf95c7371/glossary.owl
    sha256: 88e9c00b8de4c2c69d9b3120525530dbff9536f0e3cebcef7a41cbec1745feff

# The classes of the records, by the name of their kind, which the API lists at /api/<kind>.
kinds:
  tools: https://schema.org/SoftwareApplication
  methods: https://bioschemas.org/draft_terms/LabProtocol
  questions: https://schema.org/Question
  organizations: https://schema.org/Organization
  people: https://schema.org/Person
  pages: https://schema.org/CreativeWork
  videos: https://schema.org/VideoObject

# Used for short names in the YAML mappings and in the JSON-LD documents.
prefixes:
  schema: https://schema.org/
  bioschemas_draft: https://bioschemas.org/draft_terms/
  dct: http://purl.org/dc/terms/

# The kinds of records that are written through the platform's API, by the path of their pages.
writable:
  tools: https://schema.org/SoftwareApplication
  methods: https://bioschemas.org/draft_terms/LabProtocol
