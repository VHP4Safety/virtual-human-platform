name: site
title: Website pages
# The platform's own pages as the website's templates had them, from the main branch at one commit, and its
# partner list; read once, when the platform first goes live (linkeddata/parsers/site.py).
files:
  home: https://raw.githubusercontent.com/VHP4Safety/virtual-human-platform/36575d738685a90303a78e7e315aac5235873669/templates/home.html
  explore_our_work: https://raw.githubusercontent.com/VHP4Safety/virtual-human-platform/36575d738685a90303a78e7e315aac5235873669/templates/implementation/explore_our_work.html
  training: https://raw.githubusercontent.com/VHP4Safety/virtual-human-platform/36575d738685a90303a78e7e315aac5235873669/templates/implementation/training.html
  impact: https://raw.githubusercontent.com/VHP4Safety/virtual-human-platform/36575d738685a90303a78e7e315aac5235873669/templates/implementation/impact.html
  SafetyAssessmentWorkflow: https://raw.githubusercontent.com/VHP4Safety/virtual-human-platform/36575d738685a90303a78e7e315aac5235873669/templates/safety_assessment_workflow.html
  terms_of_service: https://raw.githubusercontent.com/VHP4Safety/virtual-human-platform/36575d738685a90303a78e7e315aac5235873669/templates/legal/terms_of_service.html
  privacypolicy: https://raw.githubusercontent.com/VHP4Safety/virtual-human-platform/36575d738685a90303a78e7e315aac5235873669/templates/legal/privacypolicy.html
  casestudies: https://raw.githubusercontent.com/VHP4Safety/virtual-human-platform/36575d738685a90303a78e7e315aac5235873669/templates/case_studies/casestudies.html
  partners: https://raw.githubusercontent.com/VHP4Safety/virtual-human-platform/36575d738685a90303a78e7e315aac5235873669/static/images/partners/partners.txt
parser: site

# The rules of each kind of row: the arguments of rdfsolve's Rule.between.
rules:
  Platform:
    - {predicate: a, value: "https://schema.org/DataCatalog"}
    - {predicate: "https://schema.org/name", object: name}
    - {predicate: "https://schema.org/alternateName", object: heading}
    - {predicate: "https://schema.org/abstract", object: abstract}
    - {predicate: "https://schema.org/description", object: description}
    - {predicate: "https://schema.org/publisher", object: publisher}
    - {predicate: "https://schema.org/subjectOf", object: pages}
    - {predicate: "http://rdfs.org/ns/void#classPartition", object: kinds}
  Kind:
    - {predicate: "http://rdfs.org/ns/void#class", object: class}
    - {predicate: "https://schema.org/name", object: name}
    - {predicate: "https://schema.org/description", object: description}
    - {predicate: "https://schema.org/position", object: position}
  Page:
    - {predicate: a, value: "https://schema.org/WebPage"}
    - {predicate: "https://schema.org/name", object: name}
    - {predicate: "https://schema.org/description", object: description}
    - {predicate: "https://schema.org/about", object: about}
    - {predicate: "https://schema.org/hasPart", object: sections}
  AboutPage:
    - {predicate: a, value: "https://schema.org/AboutPage"}
    - {predicate: "https://schema.org/name", object: name}
    - {predicate: "https://schema.org/description", object: description}
    - {predicate: "https://schema.org/mainEntity", object: subject}
    - {predicate: "https://schema.org/hasPart", object: sections}
  Section:
    - {predicate: a, value: "https://schema.org/WebPageElement"}
    - {predicate: "https://schema.org/name", object: heading}
    - {predicate: "https://schema.org/text", object: text}
    - {predicate: "https://schema.org/position", object: position}
    - {predicate: "https://schema.org/creativeWorkStatus", object: status}
    - {predicate: "https://schema.org/image", object: figures}
    - {predicate: "https://schema.org/video", object: videos}
    - {predicate: "https://schema.org/hasPart", object: sections}
    - {predicate: "https://schema.org/about", object: about}
  Figure:
    - {predicate: a, value: "https://schema.org/ImageObject"}
    - {predicate: "https://schema.org/contentUrl", object: image}
    - {predicate: "https://schema.org/caption", object: caption}
  Video:
    - {predicate: a, value: "https://schema.org/VideoObject"}
    - {predicate: "https://schema.org/name", object: title}
    - {predicate: "https://schema.org/embedUrl", object: player}
  Project:
    - {predicate: a, value: "https://schema.org/ResearchProject"}
    - {predicate: "https://schema.org/name", object: name}
    - {predicate: "https://schema.org/alternateName", object: full_name}
    - {predicate: "https://schema.org/description", object: description}
    - {predicate: "https://schema.org/email", object: email}
    - {predicate: "https://schema.org/sameAs", object: elsewhere}
    - {predicate: "https://schema.org/funding", object: grants}
    - {predicate: "https://schema.org/subjectOf", object: videos}
    - {predicate: "https://schema.org/image", object: figures}
    - {predicate: "https://schema.org/subOrganization", object: lines}
    - {predicate: "https://schema.org/member", object: partners}
    - {predicate: "https://schema.org/funder", object: cofunders}
  Line:
    - {predicate: a, value: "https://schema.org/ResearchProject"}
    - {predicate: "https://schema.org/name", object: name}
    - {predicate: "https://schema.org/description", object: description}
  Partner:
    - {predicate: a, value: "https://schema.org/OrganizationRole"}
    - {predicate: "https://schema.org/member", object: organization}
    - {predicate: "https://schema.org/roleName", object: role}
  Organization:
    - {predicate: a, value: "https://schema.org/Organization"}
    - {predicate: "https://schema.org/name", object: name}
    - {predicate: "https://schema.org/url", object: url}
    - {predicate: "https://schema.org/logo", object: logo}
  Grant:
    - {predicate: a, value: "https://schema.org/MonetaryGrant"}
    - {predicate: "https://schema.org/name", object: name}
    - {predicate: "https://schema.org/identifier", object: identifier}
    - {predicate: "https://schema.org/funder", object: funder}
    - {predicate: "https://schema.org/amount", object: amount}
    - {predicate: "https://schema.org/url", object: url}
    - {predicate: "https://schema.org/description", object: description}
  Amount:
    - {predicate: a, value: "https://schema.org/MonetaryAmount"}
    - {predicate: "https://schema.org/value", object: value}
    - {predicate: "https://schema.org/currency", object: currency}
  CaseStudy:
    - {predicate: a, value: "https://bioschemas.org/draft_terms/Study"}
    - {predicate: "https://schema.org/image", object: image}
