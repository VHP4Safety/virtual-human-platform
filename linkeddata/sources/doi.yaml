name: doi
title: DOI registration agencies (Crossref, DataCite)
# The publications, each by its DOI (the address in its sameAs that starts with https://doi.org/), with the
# citation that doi.org gives for it, as Crossref or DataCite registered it.
enriches: publications
identifier: https://doi.org/
keys: ^10\.\d{4,9}/\S+$
answer: https://doi.org/{key}
accept: application/vnd.citationstyles.csl+json
parser: doi

# How the parsed rows become the model: the arguments of rdfsolve's Rule.between, for each kind of row.
rules:
  Publication:
    - {predicate: a, value: "https://schema.org/ScholarlyArticle"}
    - {predicate: "https://schema.org/name", object: title}
    - {predicate: "https://schema.org/datePublished", object: date}
    - {predicate: "https://schema.org/isPartOf", object: journal}
  Journal:
    - {predicate: a, value: "https://schema.org/Periodical"}
    - {predicate: "https://schema.org/name", object: name}
    - {predicate: "https://schema.org/issn", object: issn}
