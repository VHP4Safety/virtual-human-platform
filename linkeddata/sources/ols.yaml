name: ols
title: Ontology Lookup Service (EMBL-EBI)
# The ontologies, with their titles and namespaces.
url: https://www.ebi.ac.uk/ols4/api/ontologies?size=1000
# Each term the records are about, by address; terms of the model's vocabularies are read from their files.
terms: https://www.ebi.ac.uk/ols4/api/terms?iri={iri}
parser: ols
# Terms and ontologies take the glossary's rules.
uses: [glossary]
