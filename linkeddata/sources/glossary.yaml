name: glossary
title: VHP4Safety glossary
# The glossary's terms, from its main branch every night; the model keeps the pinned file (vocabulary), from
# which the profile and the parsers' links to terms are made, and the checks note the terms of the profile
# that main drops or renames.
url: https://raw.githubusercontent.com/VHP4Safety/glossary/main/glossary.owl
vocabulary: vhp4safety-glossary-34f9389.ttl
parser: glossary

# How the parsed rows become the model: the arguments of rdfsolve's Rule.between, for each kind of row.
rules:
  Term:
    - {predicate: a, value: "https://schema.org/DefinedTerm"}
    - {predicate: "https://schema.org/name", object: label}
    - {predicate: "https://schema.org/description", object: definition}
    - {predicate: "https://schema.org/termCode", object: code}
    - {predicate: "https://schema.org/inDefinedTermSet", object: vocabulary}
    - {predicate: "https://schema.org/alternateName", object: alternate}
    - {predicate: "https://schema.org/sameAs", object: same_as}
  Vocabulary:
    - {predicate: a, value: "https://schema.org/DefinedTermSet"}
    - {predicate: "https://schema.org/name", object: name}
    - {predicate: "https://schema.org/url", object: namespace}
    - {predicate: "https://schema.org/description", object: description}
