name: models
title: Zenodo community vhp4safety, models
url: https://zenodo.org/api/records?communities=vhp4safety&type=model&size=25&sort=newest
# From each model's RO-Crate zip, only these files are read (linkeddata/parsers/models.py).
members: [ro-crate-metadata.json, pbpk-model-metadata.json]
parser: models

# The rows of people, organisations and publications are shaped as BioStudies' and take its rules.
uses: [biostudies]
rules:
  Model:
    - {predicate: a, value: "https://schema.org/SoftwareSourceCode"}
    - {predicate: "https://schema.org/name", object: name}
    - {predicate: "https://schema.org/alternateName", object: alternateName}
    - {predicate: "https://schema.org/description", object: description}
    - {predicate: "https://schema.org/version", object: version}
    - {predicate: "https://schema.org/creator", object: creator}
    - {predicate: "https://schema.org/creator", object: author}
    - {predicate: "https://schema.org/contributor", object: contributor}
    - {predicate: "https://schema.org/codeRepository", object: codeRepository}
    - {predicate: "https://schema.org/programmingLanguage", object: programmingLanguage}
    - {predicate: "https://schema.org/runtimePlatform", object: runtimePlatform}
    - {predicate: "https://schema.org/softwareRequirements", object: softwareRequirements}
    - {predicate: "https://schema.org/license", object: license}
    - {predicate: "https://schema.org/citation", object: citation}
    - {predicate: "https://schema.org/funding", object: funding}
    - {predicate: "https://schema.org/about", object: about}
    - {predicate: "https://schema.org/keywords", object: keywords}
    - {predicate: "https://schema.org/applicationCategory", object: applicationCategory}
    - {predicate: "https://schema.org/datePublished", object: published}
    - {predicate: "https://schema.org/isBasedOn", object: page}
    - {predicate: "https://schema.org/sameAs", object: doi}
    - {predicate: "https://bioschemas.org/terms/input", object: input}
    - {predicate: "https://bioschemas.org/terms/output", object: output}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#intendedUse", object: intendedUse}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#mathematicalRepresentation", object: mathematicalRepresentation}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#modelStructureDescription", object: modelStructureDescription}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#structuralCompartments", object: structuralCompartments}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#connections", object: connections}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#implementation", object: implementation}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#hasChemical", object: hasChemical}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#hasBiologicalSystem", object: hasBiologicalSystem}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#hasParameter", object: hasParameter}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#hasCalibration", object: hasCalibration}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#hasEvaluation", object: hasEvaluation}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#hasSUVAnalysis", object: hasSUVAnalysis}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#applicabilityDomain", object: applicabilityDomain}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#limitations", object: limitations}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#reproducibilityInstructions", object: reproducibilityInstructions}
  ComputerLanguage:
    - {predicate: a, value: "https://schema.org/ComputerLanguage"}
    - {predicate: "https://schema.org/name", object: name}
    - {predicate: "https://schema.org/url", object: url}
    - {predicate: "https://schema.org/version", object: version}
    - {predicate: "https://schema.org/alternateName", object: alternateName}
  # A chemical's fields; its class is the crate's (MolecularEntity or ChemicalSubstance).
  Chemical:
    - {predicate: "https://schema.org/name", object: name}
    - {predicate: "https://schema.org/alternateName", object: alternateName}
    - {predicate: "https://schema.org/description", object: description}
    - {predicate: "https://schema.org/identifier", object: identifier}
    - {predicate: "https://schema.org/inChI", object: inChI}
    - {predicate: "https://schema.org/inChIKey", object: inChIKey}
    - {predicate: "https://schema.org/smiles", object: smiles}
    - {predicate: "https://schema.org/molecularFormula", object: molecularFormula}
    - {predicate: "https://schema.org/molecularWeight", object: molecularWeight}
    - {predicate: "https://schema.org/sameAs", object: sameAs}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#chemicalRole", object: chemicalRole}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#physicochemicalNotes", object: physicochemicalNotes}
  MolecularEntity:
    - {predicate: a, value: "https://schema.org/MolecularEntity"}
  ChemicalSubstance:
    - {predicate: a, value: "https://schema.org/ChemicalSubstance"}
  PropertyValue:
    - {predicate: a, value: "https://schema.org/PropertyValue"}
    - {predicate: "https://schema.org/propertyID", object: propertyID}
    - {predicate: "https://schema.org/value", object: value}
  BiologicalSystem:
    - {predicate: a, value: "https://platform.vhp4safety.nl/model/v1/pbpk#BiologicalSystem"}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#species", object: species}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#lifeStage", object: lifeStage}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#physiologicalScope", object: physiologicalScope}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#populationDescription", object: populationDescription}
  Compartment:
    - {predicate: a, value: "https://platform.vhp4safety.nl/model/v1/pbpk#Compartment"}
    - {predicate: "https://schema.org/name", object: name}
  Connection:
    - {predicate: a, value: "https://platform.vhp4safety.nl/model/v1/pbpk#Connection"}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#sourceCompartment", object: sourceCompartment}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#targetCompartment", object: targetCompartment}
    - {predicate: "https://schema.org/description", object: description}
  Implementation:
    - {predicate: a, value: "https://platform.vhp4safety.nl/model/v1/pbpk#Implementation"}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#implementationType", object: implementationType}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#implementationLocation", object: implementationLocation}
  Parameter:
    - {predicate: a, value: "https://platform.vhp4safety.nl/model/v1/pbpk#Parameter"}
    - {predicate: "https://schema.org/name", object: name}
    - {predicate: "https://schema.org/propertyID", object: propertyID}
    - {predicate: "https://schema.org/value", object: value}
    - {predicate: "https://schema.org/unitText", object: unitText}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#parameterCategory", object: parameterCategory}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#sourceReference", object: sourceReference}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#notes", object: notes}
  Calibration:
    - {predicate: a, value: "https://platform.vhp4safety.nl/model/v1/pbpk#Calibration"}
    - {predicate: "https://schema.org/description", object: description}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#notes", object: notes}
  Evaluation:
    - {predicate: a, value: "https://platform.vhp4safety.nl/model/v1/pbpk#Evaluation"}
    - {predicate: "https://schema.org/name", object: name}
    - {predicate: "https://schema.org/description", object: description}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#evaluationData", object: evaluationData}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#performanceMetrics", object: performanceMetrics}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#outcome", object: outcome}
  PerformanceMetric:
    - {predicate: a, value: "https://platform.vhp4safety.nl/model/v1/pbpk#PerformanceMetric"}
    - {predicate: "https://schema.org/name", object: name}
    - {predicate: "https://schema.org/value", object: value}
  SUVAnalysis:
    - {predicate: a, value: "https://platform.vhp4safety.nl/model/v1/pbpk#SUVAnalysis"}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#analysisType", object: analysisType}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#method", object: method}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#outcome", object: outcome}
    - {predicate: "https://platform.vhp4safety.nl/model/v1/pbpk#notes", object: notes}
  FormalParameter:
    - {predicate: a, value: "https://bioschemas.org/terms/FormalParameter"}
    - {predicate: "https://schema.org/name", object: name}
  Grant:
    - {predicate: a, value: "https://schema.org/MonetaryGrant"}
    - {predicate: "https://schema.org/name", object: name}
    - {predicate: "https://schema.org/identifier", object: identifier}
    - {predicate: "https://schema.org/url", object: url}
    - {predicate: "https://schema.org/funder", object: funder}
