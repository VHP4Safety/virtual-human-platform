name: casestudies
title: Case studies
parser: casestudies
# The case studies' RO-Crate, and each one's content file, by identifier.
files:
  crate: https://raw.githubusercontent.com/VHP4Safety/ui-casestudy-config/refs/heads/main/ro-crate-metadata.json
  kidney: https://raw.githubusercontent.com/VHP4Safety/ui-casestudy-config/refs/heads/main/kidney_content.json
  parkinson: https://raw.githubusercontent.com/VHP4Safety/ui-casestudy-config/refs/heads/main/parkinson_content.json
  thyroid: https://raw.githubusercontent.com/VHP4Safety/ui-casestudy-config/refs/heads/main/thyroid_content.json

# The rules of each kind of row: the arguments of rdfsolve's Rule.between.
rules:
  CaseStudy:
    - {predicate: a, value: "https://bioschemas.org/draft_terms/Study"}
    - {predicate: "https://schema.org/name", object: name}
    - {predicate: "https://schema.org/description", object: description}
    - {predicate: "https://schema.org/about", object: about}
    - {predicate: "https://schema.org/keywords", object: keywords}
    - {predicate: "https://schema.org/abstract", object: intro}
    - {predicate: "https://schema.org/text", object: content}
    - {predicate: "https://schema.org/hasPart", object: sections}
    - {predicate: "https://vhp4safety.github.io/glossary#VHP0000151", object: questions}
  Question:
    - {predicate: a, value: "https://schema.org/HowTo"}
    - {predicate: "https://schema.org/name", object: label}
    - {predicate: "https://schema.org/text", object: text}
    - {predicate: "https://schema.org/headline", object: headline}
    - {predicate: "https://schema.org/position", object: position}
    - {predicate: "https://schema.org/description", object: summary}
    - {predicate: "https://schema.org/hasPart", object: sections}
    - {predicate: "https://schema.org/step", object: steps}
    - {predicate: "https://schema.org/tool", object: tools}
    - {predicate: "https://schema.org/supply", object: supplies}
  Workflow:
    - {predicate: a, value: "https://schema.org/HowTo"}
    - {predicate: "https://schema.org/name", object: title}
    - {predicate: "https://schema.org/description", object: summary}
    - {predicate: "https://schema.org/text", object: content}
    - {predicate: "https://schema.org/about", object: about}
    - {predicate: "https://schema.org/creativeWorkStatus", object: status}
    - {predicate: "https://schema.org/position", object: position}
    - {predicate: "https://schema.org/step", object: steps}
    - {predicate: "https://schema.org/tool", object: tools}
    - {predicate: "https://schema.org/supply", object: supplies}
    - {predicate: "https://schema.org/hasPart", object: sections}
    - {predicate: "https://bioschemas.org/terms/input", object: inputs}
    - {predicate: "https://bioschemas.org/terms/output", object: outputs}
  Parameter:
    - {predicate: a, value: "https://bioschemas.org/terms/FormalParameter"}
    - {predicate: "https://schema.org/name", object: name}
  Section:
    - {predicate: a, value: "https://schema.org/WebPageElement"}
    - {predicate: "https://schema.org/name", object: title}
    - {predicate: "https://schema.org/text", object: text}
    - {predicate: "https://schema.org/position", object: position}
