{% extends "base.html" %}
{# The page of an error, such as 404 Not Found. #}
{% block content %}
<section class="container py-md-5 py-3">
  <h1><span class="text-vhpblue">{{ error.code }}</span> {{ error.name }}</h1>
  {% if error.description %}<p class="text-secondary fs-5">{{ error.description }}</p>{% endif %}
  <a class="btn btn-vhpblue" href="{{ url_for('home') }}"><i class="bi bi-house pe-1"></i>Home</a>
</section>
{% endblock %}
