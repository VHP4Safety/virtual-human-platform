{% extends "base.html" %}
{% import "records/_outline.html" as outlined %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/casestudies.css') }}" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/case-study.css') }}" />

<div id="case-study" data-document="{{ case_document }}" data-at="{{ page_address }}">
  {# The case study for readers without scripts, such as search engines and agents; the page drawn below replaces it. #}
  <div class="container py-md-5 py-3">
    {{ outlined.article(case_outline, 1) }}
  </div>
</div>

<!-- Feedback button to link to the GitHub issue page so users can submit issues/feedback -->
<a href="https://github.com/VHP4Safety/ui-casestudy-config/issues/new">
  <button class="btn btn-vhppink-distinct ms-2" style="position: fixed; bottom: 20px; right: 20px;">Give Us feedback</button>
</a>

<script type="module">
  import { renderCaseStudy } from "{{ url_for('static', filename='js/case-study.js') }}";

  // The page in view is the browser's address, so it can be shared and the back button returns to the last one.
  const container = document.getElementById("case-study");
  const base = {{ config_base|tojson }};
  const response = await fetch(container.dataset.document, { headers: { Accept: "application/ld+json" } });
  if (response.ok) {
    const caseStudy = await response.json();
    const show = function (address) {
      renderCaseStudy(container, caseStudy, {
        base: base,
        at: address,
        onNavigate: function (shown) {
          const path = shown.startsWith(base) ? "/" + shown.slice(base.length) : shown;
          if (path !== window.location.pathname) {
            window.history.pushState({}, "", path);
          }
          window.scrollTo({ top: 0 });
        },
      });
    };
    show(container.dataset.at);
    window.addEventListener("popstate", function () {
      show(base + window.location.pathname.replace(/^\//, ""));
    });
  }
</script>
{% endblock %}
