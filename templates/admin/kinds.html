{% extends "editor/base.html" %}
{% block content %}
<div class="container-fluid px-lg-4 py-4">
  <h1 class="h3 text-vhppurple mb-4">Records</h1>
  <div class="row g-3">
    {% for kind in kinds %}
    <div class="col-sm-6 col-lg-3">
      <a class="card h-100 text-decoration-none" href="{{ url_for('admin.edit', kind=kind.kind) }}">
        <div class="card-body">
          <h2 class="h5 text-vhppurple">{{ kind.kind|capitalize }}</h2>
          <p class="mb-0 small text-secondary">{{ kind.records }} records · {{ kind.edited }} written here · {{ kind.removed }} removed · {{ kind.notes }} values that do not fit</p>
        </div>
      </a>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
